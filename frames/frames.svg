<svg class="fmap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2176 1440" role="img" aria-label="10 frames drawn on the five need lines, grouped by the paradox each one moves. A station marks a need the frame builds on; joined stations are the two needs it lets a person have at once. The table below lists every station." font-family="Inter, system-ui, sans-serif"><rect width="2176" height="1440" fill="#e5e7de"/><text x="56" y="82" font-size="32" font-weight="700" fill="#0b3536">Ten Frames Built From Five Human Needs</text><text x="56" y="120" font-size="15.118" fill="#0b3536">Each row is a frame, an analogy: a place people already know where they get two of these needs at once, without being paid to be there. Rows are grouped by the paradox each frame moves.</text><text x="56" y="146" font-size="15.118" fill="#0b3536">Dorst’s step 6, Frames. Built Nov 9, 2026 from the five needs on the field themes map. Hover a station for how the frame builds on that need; every station is in the table below.</text><text x="456" y="238" text-anchor="middle" font-size="15.118" font-weight="700" fill="#0b3536">Mattering</text><text x="568" y="238" text-anchor="middle" font-size="15.118" font-weight="700" fill="#0b3536">Coherence</text><text x="680" y="238" text-anchor="middle" font-size="15.118" font-weight="700" fill="#0b3536">Support</text><text x="792" y="238" text-anchor="middle" font-size="15.118" font-weight="700" fill="#0b3536">Belonging</text><text x="904" y="238" text-anchor="middle" font-size="15.118" font-weight="700" fill="#0b3536">Becoming</text><text x="988" y="238" font-size="15.118" font-weight="700" fill="#0b3536">Done well at</text><text x="1488" y="238" font-size="15.118" font-weight="700" fill="#0b3536">What gives</text><line x1="388" y1="396.0" x2="964" y2="396.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="448.0" x2="964" y2="448.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="500.0" x2="964" y2="500.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="622.0" x2="964" y2="622.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="674.0" x2="964" y2="674.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="796.0" x2="964" y2="796.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="848.0" x2="964" y2="848.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="900.0" x2="964" y2="900.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="1022.0" x2="964" y2="1022.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="388" y1="1074.0" x2="964" y2="1074.0" stroke="#0b3536" stroke-width="1" stroke-dasharray="1 5"/><line x1="456" y1="260" x2="456" y2="1094" stroke="#e6c700" stroke-width="8" stroke-linecap="butt"/><rect x="445" y="1094" width="22" height="8" fill="#e6c700"/><line x1="568" y1="260" x2="568" y2="1094" stroke="#0098d8" stroke-width="8" stroke-linecap="butt"/><rect x="557" y="1094" width="22" height="8" fill="#0098d8"/><line x1="680" y1="260" x2="680" y2="1094" stroke="#08327d" stroke-width="8" stroke-linecap="butt"/><rect x="669" y="1094" width="22" height="8" fill="#08327d"/><line x1="792" y1="260" x2="792" y2="1094" stroke="#a5a6a9" stroke-width="8" stroke-linecap="butt"/><rect x="781" y="1094" width="22" height="8" fill="#a5a6a9"/><line x1="904" y1="260" x2="904" y2="1094" stroke="#007500" stroke-width="8" stroke-linecap="butt"/><rect x="893" y="1094" width="22" height="8" fill="#007500"/><line x1="56" y1="312" x2="388" y2="312" stroke="#0b3536" stroke-width="2"/><line x1="988" y1="312" x2="2120" y2="312" stroke="#0b3536" stroke-width="2"/><text x="56" y="340" font-size="15.118" font-weight="700" fill="#0b3536" letter-spacing=".06em">SEEING THE ROUTE, MAKING YOUR OWN</text><text x="988" y="340" font-size="15.118" fill="#0b3536"><tspan font-weight="700">Pulls apart:</tspan> Coherence and Becoming, the README’s hunch</text><line x1="56" y1="538" x2="388" y2="538" stroke="#0b3536" stroke-width="2"/><line x1="988" y1="538" x2="2120" y2="538" stroke="#0b3536" stroke-width="2"/><text x="56" y="566" font-size="15.118" font-weight="700" fill="#0b3536" letter-spacing=".06em">SEEN AS YOURSELF, PART OF A TEAM</text><text x="988" y="566" font-size="15.118" fill="#0b3536"><tspan font-weight="700">Pulls apart:</tspan> Mattering and Belonging</text><line x1="56" y1="712" x2="388" y2="712" stroke="#0b3536" stroke-width="2"/><line x1="988" y1="712" x2="2120" y2="712" stroke="#0b3536" stroke-width="2"/><text x="56" y="740" font-size="15.118" font-weight="700" fill="#0b3536" letter-spacing=".06em">A PERSON AT EVERY CROSSING</text><text x="988" y="740" font-size="15.118" fill="#0b3536"><tspan font-weight="700">Pulls apart:</tspan> Support for the newcomer and for the organizer</text><line x1="56" y1="938" x2="388" y2="938" stroke="#0b3536" stroke-width="2"/><line x1="988" y1="938" x2="2120" y2="938" stroke="#0b3536" stroke-width="2"/><text x="56" y="966" font-size="15.118" font-weight="700" fill="#0b3536" letter-spacing=".06em">WHEN THE CYCLE ENDS</text><text x="988" y="966" font-size="15.118" fill="#0b3536"><tspan font-weight="700">Pulls apart:</tspan> Belonging and the deadline</text><a href="/blog/frames/#camino"><text x="56" y="401.3" font-size="15.118" font-weight="700" fill="#0b3536">The Camino</text></a><line x1="568" y1="396.0" x2="904" y2="396.0" stroke="#e5e7de" stroke-width="16"/><line x1="568" y1="396.0" x2="904" y2="396.0" stroke="#0b3536" stroke-width="6"/><circle cx="568" cy="396.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Camino, Coherence: the way is marked and holds still</title></circle><circle cx="680" cy="396.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Camino, Support: hosts who walked it themselves stamp the passport</title></circle><circle cx="904" cy="396.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Camino, Becoming: your pace, your reasons; a passport records how far you’ve come</title></circle><text x="988" y="401.3" font-size="15.118" fill="#0b3536">The pilgrimage to Santiago de Compostela</text><text x="1488" y="401.3" font-size="15.118" fill="#0b3536">The route stops being one path; the marks and the stamps hold still</text><a href="/blog/frames/#ski"><text x="56" y="453.3" font-size="15.118" font-weight="700" fill="#0b3536">The Ski Resort</text></a><line x1="568" y1="448.0" x2="904" y2="448.0" stroke="#e5e7de" stroke-width="16"/><line x1="568" y1="448.0" x2="904" y2="448.0" stroke="#0b3536" stroke-width="6"/><circle cx="568" cy="448.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Ski Resort, Coherence: signs at every junction, rated against this mountain</title></circle><circle cx="680" cy="448.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Ski Resort, Support: a ski school and a patrol for when you need them</title></circle><circle cx="904" cy="448.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Ski Resort, Becoming: you choose by skill and mood, and move up</title></circle><text x="988" y="453.3" font-size="15.118" fill="#0b3536">Trail ratings, ski school and patrol</text><text x="1488" y="453.3" font-size="15.118" fill="#0b3536">One path gives way to rated runs you choose between</text><a href="/blog/frames/#crossfit"><text x="56" y="505.3" font-size="15.118" font-weight="700" fill="#0b3536">The CrossFit Box</text></a><line x1="568" y1="500.0" x2="904" y2="500.0" stroke="#e5e7de" stroke-width="16"/><line x1="568" y1="500.0" x2="904" y2="500.0" stroke="#0b3536" stroke-width="6"/><circle cx="568" cy="500.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The CrossFit Box, Coherence: one workout, on the whiteboard, for everyone</title></circle><circle cx="680" cy="500.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The CrossFit Box, Support: a coach in every class</title></circle><circle cx="792" cy="500.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The CrossFit Box, Belonging: the same people at the same hour</title></circle><circle cx="904" cy="500.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The CrossFit Box, Becoming: scaled to where you are, so you can do it today</title></circle><text x="988" y="505.3" font-size="15.118" fill="#0b3536">One workout on the whiteboard, scaled for each person</text><text x="1488" y="505.3" font-size="15.118" fill="#0b3536">Everyone does the same session; how hard is yours to set</text><a href="/blog/frames/#credits"><text x="56" y="627.3" font-size="15.118" font-weight="700" fill="#0b3536">The Film Credits</text></a><line x1="456" y1="622.0" x2="792" y2="622.0" stroke="#e5e7de" stroke-width="16"/><line x1="456" y1="622.0" x2="792" y2="622.0" stroke="#0b3536" stroke-width="6"/><circle cx="456" cy="622.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Film Credits, Mattering: named for what you did, in words an employer can read</title></circle><circle cx="792" cy="622.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Film Credits, Belonging: the list belongs to the film, not to any one name</title></circle><text x="988" y="627.3" font-size="15.118" fill="#0b3536">Film credits; science’s CRediT roles</text><text x="1488" y="627.3" font-size="15.118" fill="#0b3536">The ranking: every role on one list, no order of names</text><a href="/blog/frames/#relay"><text x="56" y="679.3" font-size="15.118" font-weight="700" fill="#0b3536">The Relay</text></a><line x1="456" y1="674.0" x2="792" y2="674.0" stroke="#e5e7de" stroke-width="16"/><line x1="456" y1="674.0" x2="792" y2="674.0" stroke="#0b3536" stroke-width="6"/><circle cx="456" cy="674.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Relay, Mattering: your leg is yours, timed and seen</title></circle><circle cx="680" cy="674.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Relay, Support: a teammate hands off to you, and waits at the wall</title></circle><circle cx="792" cy="674.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Relay, Belonging: one result, shared by the team</title></circle><text x="988" y="679.3" font-size="15.118" fill="#0b3536">Relay swimming</text><text x="1488" y="679.3" font-size="15.118" fill="#0b3536">Your leg is timed and seen, and the result is the team’s</text><a href="/blog/frames/#station"><text x="56" y="801.3" font-size="15.118" font-weight="700" fill="#0b3536">The Train Station</text></a><line x1="568" y1="796.0" x2="680" y2="796.0" stroke="#e5e7de" stroke-width="16"/><line x1="568" y1="796.0" x2="680" y2="796.0" stroke="#0b3536" stroke-width="6"/><circle cx="568" cy="796.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Train Station, Coherence: the board shows every way on from here</title></circle><circle cx="680" cy="796.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Train Station, Support: a staffed desk at every station to ask</title></circle><text x="988" y="801.3" font-size="15.118" fill="#0b3536">Departure boards and a staffed desk; patient navigators</text><text x="1488" y="801.3" font-size="15.118" fill="#0b3536">A person per station, not per traveler</text><a href="/blog/frames/#doula"><text x="56" y="853.3" font-size="15.118" font-weight="700" fill="#0b3536">The Doula</text></a><line x1="680" y1="848.0" x2="904" y2="848.0" stroke="#e5e7de" stroke-width="16"/><line x1="680" y1="848.0" x2="904" y2="848.0" stroke="#0b3536" stroke-width="6"/><circle cx="568" cy="848.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Doula, Coherence: what’s happening, explained in plain words</title></circle><circle cx="680" cy="848.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Doula, Support: someone beside you the whole way across</title></circle><circle cx="904" cy="848.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Doula, Becoming: feeling in control, and more sure you can</title></circle><text x="988" y="853.3" font-size="15.118" fill="#0b3536">Birth companions</text><text x="1488" y="853.3" font-size="15.118" fill="#0b3536">Continuous support, given by someone who just crossed</text><a href="/blog/frames/#tailor"><text x="56" y="905.3" font-size="15.118" font-weight="700" fill="#0b3536">The Tailor’s Shop</text></a><line x1="792" y1="900.0" x2="904" y2="900.0" stroke="#e5e7de" stroke-width="16"/><line x1="792" y1="900.0" x2="904" y2="900.0" stroke="#0b3536" stroke-width="6"/><circle cx="680" cy="900.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Tailor’s Shop, Support: beside people one step ahead</title></circle><circle cx="792" cy="900.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Tailor’s Shop, Belonging: inside the shop’s real work from the first day</title></circle><circle cx="904" cy="900.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Tailor’s Shop, Becoming: from small real tasks toward the centre</title></circle><text x="988" y="905.3" font-size="15.118" fill="#0b3536">Apprenticeship, as Lave and Wenger found it</text><text x="1488" y="905.3" font-size="15.118" fill="#0b3536">Helping stops being extra hours; it’s the helper’s next step</text><a href="/blog/frames/#harbor"><text x="56" y="1027.3" font-size="15.118" font-weight="700" fill="#0b3536">The Harbor</text></a><line x1="680" y1="1022.0" x2="792" y2="1022.0" stroke="#e5e7de" stroke-width="16"/><line x1="680" y1="1022.0" x2="792" y2="1022.0" stroke="#0b3536" stroke-width="6"/><circle cx="680" cy="1022.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Harbor, Support: people who expect you, and are there when needed</title></circle><circle cx="792" cy="1022.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>The Harbor, Belonging: a crew keeps its berth between voyages</title></circle><circle cx="904" cy="1022.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>The Harbor, Becoming: a safe harbor is what lets people sail out again</title></circle><text x="988" y="1027.3" font-size="15.118" fill="#0b3536">A ship’s home port; Recurse Center; Civic Tech DC</text><text x="1488" y="1027.3" font-size="15.118" fill="#0b3536">The Cycle’s claim to be the whole of The Labs</text><a href="/blog/frames/#parkrun"><text x="56" y="1079.3" font-size="15.118" font-weight="700" fill="#0b3536">parkrun</text></a><line x1="568" y1="1074.0" x2="792" y2="1074.0" stroke="#e5e7de" stroke-width="16"/><line x1="568" y1="1074.0" x2="792" y2="1074.0" stroke="#0b3536" stroke-width="6"/><circle cx="456" cy="1074.0" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"><title>parkrun, Mattering: every helper counted, and nobody finishes last</title></circle><circle cx="568" cy="1074.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>parkrun, Coherence: same time, same place, always on</title></circle><circle cx="792" cy="1074.0" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"><title>parkrun, Belonging: the same people, every week, with no season to sign up for</title></circle><text x="988" y="1079.3" font-size="15.118" fill="#0b3536">The free 5 km, every Saturday morning</text><text x="1488" y="1079.3" font-size="15.118" fill="#0b3536">The Cycle as the only way in</text><line x1="56" y1="1156" x2="2120" y2="1156" stroke="#0b3536" stroke-width="2"/><line x1="56.0" y1="1190" x2="96.0" y2="1190" stroke="#e6c700" stroke-width="8"/><text x="110.0" y="1195.3" font-size="15.118" font-weight="700" fill="#0b3536">Mattering</text><text x="56.0" y="1226" font-size="15.118" fill="#0b3536">“I want someone to see what I can do, and for</text><text x="56.0" y="1248" font-size="15.118" fill="#0b3536">it to count.”</text><text x="56.0" y="1314" font-size="15.118" fill="#0b3536">3 of 10 frames; 27 of 50 in the field</text><line x1="468.8" y1="1190" x2="508.8" y2="1190" stroke="#0098d8" stroke-width="8"/><text x="522.8" y="1195.3" font-size="15.118" font-weight="700" fill="#0b3536">Coherence</text><text x="468.8" y="1226" font-size="15.118" fill="#0b3536">“I need this to make sense: where I am, what’s</text><text x="468.8" y="1248" font-size="15.118" fill="#0b3536">next, and that I can handle it.”</text><text x="468.8" y="1314" font-size="15.118" fill="#0b3536">6 of 10 frames; 14 of 50 in the field</text><line x1="881.6" y1="1190" x2="921.6" y2="1190" stroke="#08327d" stroke-width="8"/><text x="935.6" y="1195.3" font-size="15.118" font-weight="700" fill="#0b3536">Support</text><text x="881.6" y="1226" font-size="15.118" fill="#0b3536">“I don’t want to face the hard part by myself.”</text><text x="881.6" y="1314" font-size="15.118" fill="#0b3536">8 of 10 frames; 17 of 50 in the field</text><line x1="1294.4" y1="1190" x2="1334.4" y2="1190" stroke="#a5a6a9" stroke-width="8"/><text x="1348.4" y="1195.3" font-size="15.118" font-weight="700" fill="#0b3536">Belonging</text><text x="1294.4" y="1226" font-size="15.118" fill="#0b3536">“I want a place, and people, that are still</text><text x="1294.4" y="1248" font-size="15.118" fill="#0b3536">mine when this ends.”</text><text x="1294.4" y="1314" font-size="15.118" fill="#0b3536">6 of 10 frames; 18 of 50 in the field</text><line x1="1707.2" y1="1190" x2="1747.2" y2="1190" stroke="#007500" stroke-width="8"/><text x="1761.2" y="1195.3" font-size="15.118" font-weight="700" fill="#0b3536">Becoming</text><text x="1707.2" y="1226" font-size="15.118" fill="#0b3536">“I want to believe I can become someone new,</text><text x="1707.2" y="1248" font-size="15.118" fill="#0b3536">and that I’m allowed to.”</text><text x="1707.2" y="1314" font-size="15.118" fill="#0b3536">6 of 10 frames; 9 of 50 in the field</text><circle cx="65" cy="1384" r="9" fill="#e5e7de" stroke="#0b3536" stroke-width="4"/><text x="86" y="1389.3" font-size="15.118" fill="#0b3536">The frame builds on this need</text><line x1="476" y1="1384" x2="556" y2="1384" stroke="#0b3536" stroke-width="6"/><circle cx="476" cy="1384" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"/><circle cx="556" cy="1384" r="9" fill="#0b3536" stroke="#0b3536" stroke-width="4"/><text x="580" y="1389.3" font-size="15.118" fill="#0b3536">Joined: the two needs the frame lets a person have at once, like the platforms of an interchange. An open station on the link is a need it also touches.</text></svg>